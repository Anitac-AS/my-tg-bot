<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>書書小口袋</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFF6E5" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Chiron+GoRound+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FFF6E5;
      --ink: #1E3A2F;
      --ink-2: #3F5A4E;
      --muted: #4D6B5E;
      --line: #D9D2C3;
      --mint: #BDEBD3;
      --mint-soft: #E8F7EF;
      --peach: #FFC8A6;
      --butter: #FFE27A;
      --sky: #BFE0FF;
      --pink: #FFD6E0;
      --coral: #FF8A65;
      --white: #FFFFFF;
      --font: 'Chiron GoRound TC', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
      --font-latin: 'Mitr', 'Chiron GoRound TC', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
      --bounce: cubic-bezier(.3, 1.4, .5, 1);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; overflow-x: hidden; overflow-x: clip; }
    body {
      margin: 0; position: relative;
      overflow-x: clip;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font);
    }
    button, input, textarea { font: inherit; color: inherit; }
    a { color: var(--ink); }
    a:hover { color: #C2410C; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    /* 背景圓 */
    .bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .blob { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
    .blob-a { width: 420px; height: 420px; background: var(--butter); top: -180px; right: -120px; }
    .blob-b { width: 260px; height: 260px; background: var(--mint); top: 140px; left: -140px; }

    .wrap {
      position: relative; z-index: 1;
      max-width: 1200px; margin: 0 auto;
      padding: 44px 32px 80px;
      display: flex; flex-direction: column; gap: 28px;
    }

    /* ===== Header ===== */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .home { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); }
    .home:hover { color: var(--ink); }
    .home-mark {
      width: 58px; height: 58px; border-radius: 18px; flex-shrink: 0;
      background: var(--coral); border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center;
      transition: transform .4s var(--bounce);
    }
    .home:hover .home-mark { transform: rotate(90deg); }
    .home-text { display: flex; flex-direction: column; }
    .home-title { font-family: var(--font); font-weight: 800; font-size: 42px; line-height: 1.1; letter-spacing: 1px; }
    .home-sub { font-size: 15px; font-weight: 500; margin-top: 4px; }
    .top-actions { display: flex; gap: 10px; align-items: center; }

    .pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 8px 18px;
      border: 2px solid var(--ink); border-radius: 999px;
      background: transparent; color: var(--ink);
      font-weight: 700; font-size: 14px; cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .pill:hover { transform: scale(1.05); }
    .pill:disabled { opacity: .6; cursor: default; transform: none; }
    .pill-ink { background: var(--ink); color: var(--cream); }
    .pill-coral { background: var(--coral); color: var(--ink); }
    .pill-white { background: var(--white); }
    .count-pill {
      font-weight: 700; font-size: 14px; background: var(--white);
      border: 2px solid var(--ink); border-radius: 999px; padding: 8px 14px;
      white-space: nowrap;
    }
    .count-pill:empty { display: none; }

    /* ===== Search ===== */
    .search-box {
      background: var(--white); border: 2px solid var(--ink); border-radius: 32px;
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
    }
    .search-row { display: flex; gap: 10px; align-items: center; }
    .search-field {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
      background: var(--cream); border-radius: 999px; padding: 0 18px;
      border: 2px solid transparent; transition: border-color .15s;
    }
    .search-field:focus-within { border-color: var(--ink); }
    .search-field input {
      flex: 1; min-width: 0; border: none; background: transparent; outline: none;
      padding: 15px 0; font-size: 16px; font-weight: 500;
    }
    .search-field input::placeholder { color: var(--muted); }
    .search-row .pill { min-height: 54px; padding: 0 28px; font-size: 16px; font-weight: 800; }

    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .type-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .type-btn {
      min-height: 40px; padding: 8px 16px; border-radius: 999px;
      border: 2px solid var(--line); background: var(--white); color: var(--ink);
      font-weight: 700; font-size: 14px; cursor: pointer;
      transition: transform .15s ease;
    }
    .type-btn:hover { transform: scale(1.05); }
    .type-btn.active { background: var(--mint); border-color: var(--ink); }
    .active-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
      padding: 6px 12px; border-radius: 999px; border: none;
      background: var(--ink); color: var(--cream); font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .filter-chip svg { opacity: .8; }
    .filter-chip:hover svg { opacity: 1; }
    .clear-btn {
      background: none; border: none; color: var(--ink); font-weight: 700; font-size: 13px;
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 4px;
    }

    /* ===== Tag stickers ===== */
    .tag-nav { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 0 4px; }
    .sticker {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
      padding: 8px 14px; border: 2px solid var(--ink); border-radius: 14px;
      font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink);
      transform: rotate(var(--rot, 0deg));
      transition: transform .15s ease;
    }
    .sticker:hover { transform: rotate(0deg) scale(1.08); }
    .sticker.active { background: var(--ink) !important; color: var(--cream); }
    .sticker .cnt {
      font-family: var(--font-latin); font-weight: 500; font-size: 12px;
      background: var(--white); color: var(--ink); border-radius: 999px; padding: 0 7px;
    }
    .more-btn {
      background: none; border: none; font-weight: 700; font-size: 14px; color: var(--ink);
      text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 4px;
    }

    /* ===== Cards ===== */
    .cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
      gap: 24px; align-items: start;
    }
    .card {
      position: relative; min-width: 0; background: var(--white);
      border: 2px solid var(--ink); border-radius: 28px; padding: 14px;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .25s var(--bounce);
      animation: cardIn .45s var(--bounce) backwards;
    }
    .card:hover { transform: translateY(-6px) rotate(-.6deg); }
    .card:focus-within { outline: 3px solid var(--ink); outline-offset: 4px; }
    .card-media {
      height: 170px; border-radius: 20px; overflow: hidden;
      background: var(--peach);
    }
    .card-media img, .panel-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 10px; }
    .card-open {
      all: unset; cursor: pointer; font-weight: 800; font-size: 20px; line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .card-open::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 28px; }
    .card-open:focus-visible { outline: none; }
    .card-summary {
      margin: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.7; color: var(--ink-2);
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* 重溫卡 */
    .resurface { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 20px; padding-top: 8px; }
    .resurface[hidden] { display: none; }
    .rs-card {
      position: relative; min-width: 0; border: 2px solid var(--ink); border-radius: 28px;
      padding: 20px 22px; display: flex; flex-direction: column; gap: 10px;
      transition: transform .25s var(--bounce);
    }
    .rs-card:hover { transform: translateY(-4px) rotate(-.4deg); }
    .rs-card:focus-within { outline: 3px solid var(--ink); outline-offset: 4px; }
    .rs-label {
      position: absolute; top: -12px; left: 20px; z-index: 2; background: var(--white); border: 2px solid var(--ink);
      border-radius: 10px; padding: 2px 12px; font-size: 13px; font-weight: 800; transform: rotate(var(--rot, -3deg));
    }
    .rs-meta { font-family: var(--font-latin); font-size: 13px; color: #2F4B40; margin-top: 6px; }
    .rs-title { all: unset; cursor: pointer; font-weight: 800; font-size: 20px; line-height: 1.35; overflow-wrap: anywhere; }
    .rs-title::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 28px; }
    .rs-title:focus-visible { outline: none; }
    .rs-summary { margin: 0; font-size: 14px; line-height: 1.7; color: #2F4B40; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .rs-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rs-foot .pill { position: relative; z-index: 2; min-height: 40px; background: var(--white); }
    .rs-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .rs-tags span { font-size: 12px; font-weight: 700; background: var(--white); border-radius: 999px; padding: 4px 10px; transform: rotate(var(--rot, 0deg)); }

    /* AI 整理 */
    .ai-bar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
    .ai-bar[hidden] { display: none; }
    .ai-btn { font-size: 15px; font-weight: 800; min-height: 46px; padding: 10px 20px; }
    .ai-card {
      position: relative; background: var(--white); border: 2px solid var(--ink); border-radius: 32px;
      padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px;
      animation: cardIn .4s var(--bounce);
    }
    .ai-card[hidden] { display: none; }
    .ai-label {
      position: absolute; top: -14px; left: 24px; background: var(--butter); border: 2px solid var(--ink);
      border-radius: 10px; padding: 3px 12px; font-size: 13px; font-weight: 800; transform: rotate(-3deg);
    }
    .ai-intro { margin: 6px 0 0; font-size: 16px; line-height: 1.85; font-weight: 700; overflow-wrap: anywhere; }
    .ai-points { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; }
    .ai-excluded { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.7; }
    .ai-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 2px dashed var(--line); padding-top: 12px; font-size: 13px; color: var(--muted); }
    .ai-foot .pill { min-height: 36px; padding: 6px 14px; font-size: 13px; background: var(--white); }
    .ai-foot .push { margin-left: auto; }
    .ai-loading { display: flex; gap: 10px; align-items: center; font-weight: 700; margin-top: 6px; }
    .ai-loading .spinner { border-color: rgba(30, 58, 47, .2); border-top-color: var(--ink); }
    .cite {
      display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px;
      margin: 0 2px; padding: 0 4px; border-radius: 999px; background: var(--sky); border: 1.5px solid var(--ink);
      font-family: var(--font-latin); font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; vertical-align: 2px;
    }
    .cite:hover { background: var(--ink); color: var(--cream); }
    .cite-badge {
      position: absolute; top: -10px; left: -10px; z-index: 3; width: 32px; height: 32px; border-radius: 999px;
      background: var(--sky); border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-latin); font-weight: 600; font-size: 13px;
    }

    .sem-badge {
      align-self: flex-start; display: inline-flex; align-items: center; gap: 4px;
      background: var(--sky); border-radius: 999px; padding: 2px 10px;
      font-size: 12px; font-weight: 800; color: var(--ink);
    }
    .reindex-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--sky); border: 2px solid var(--ink); border-radius: 20px; padding: 12px 16px;
      font-size: 14px; font-weight: 700; line-height: 1.5;
    }
    .reindex-bar[hidden] { display: none; }
    .reindex-bar .pill { min-height: 40px; }
    .related { display: flex; flex-direction: column; gap: 10px; border-top: 2px dashed var(--line); padding-top: 14px; }
    .related h3 { margin: 0; font-size: 15px; font-weight: 800; }
    .related-list { display: flex; flex-direction: column; gap: 8px; }
    .related-item {
      all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center;
      background: var(--cream); border-radius: 18px; padding: 10px 12px;
      transition: transform .15s ease, background .15s ease;
    }
    .related-item:hover { background: var(--mint-soft); transform: translateX(4px); }
    .related-item:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    .related-thumb { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; flex-shrink: 0; background: var(--peach); }
    .related-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .related-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .related-title { font-weight: 800; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
    .related-meta { font-size: 12px; color: var(--muted); }
    .related-empty { margin: 0; font-size: 13px; color: var(--muted); }
    .card-snippet {
      margin: 0; overflow-wrap: anywhere; font-size: 13px; line-height: 1.6; color: var(--ink-2);
      background: var(--cream); border-radius: 12px; padding: 8px 10px;
    }
    .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini-tag {
      position: relative; z-index: 2;
      border: none; border-radius: 999px; padding: 4px 10px; min-height: 28px;
      font-weight: 700; font-size: 12px; color: var(--ink); cursor: pointer;
      transform: rotate(var(--rot, 0deg)); transition: transform .15s ease;
    }
    .mini-tag:hover { transform: rotate(0deg) scale(1.08); }
    .mini-tag.active { background: var(--ink) !important; color: var(--cream); }
    .card-date { font-family: var(--font-latin); font-size: 12px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
    .pin-sticker {
      position: absolute; top: -10px; right: 18px; z-index: 3;
      background: var(--coral); border: 2px solid var(--ink); border-radius: 10px;
      padding: 2px 10px; font-size: 12px; font-weight: 800; transform: rotate(4deg);
    }
    mark { background: var(--butter); color: inherit; border-radius: 4px; padding: 0 2px; }

    .load-more-wrap { grid-column: 1 / -1; text-align: center; padding: 8px 0 24px; }
    .empty { grid-column: 1 / -1; text-align: center; font-weight: 800; font-size: 20px; margin: 40px 0; }
    #sentinel { height: 1px; }

    /* ===== Toast ===== */
    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 4000;
      transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
      background: var(--ink); color: var(--cream); border-radius: 999px;
      padding: 10px 18px; font-size: 14px; font-weight: 700;
      transition: opacity .2s ease, transform .3s var(--bounce);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Expandable panel ===== */
    .overlay {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .overlay[hidden] { display: none; }
    .backdrop { position: absolute; inset: 0; background: rgba(30, 58, 47, .35); }
    .panel {
      position: relative; z-index: 1;
      width: min(620px, 100%);
      max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
      overflow: auto; overscroll-behavior: contain;
      background: var(--white); border: 2px solid var(--ink); border-radius: 36px;
      padding: 16px;
    }
    .panel.morphing { overflow: hidden; }
    .panel-close-wrap { position: sticky; top: 0; height: 0; z-index: 3; }
    .panel-close {
      position: absolute; top: 10px; right: 10px;
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid var(--ink); background: var(--white); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s ease;
    }
    .panel-close:hover { transform: rotate(90deg); }
    .panel-body { display: flex; flex-direction: column; gap: 16px; }
    .panel-media { height: 240px; flex-shrink: 0; border-radius: 26px; overflow: hidden; background: var(--peach); }
    .panel-main { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 14px; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding-right: 52px; }
    .panel-media + .panel-main .panel-head { padding-right: 0; }
    .panel-head > div { flex: 1; min-width: 0; }
    .panel-head .pill { white-space: nowrap; flex-shrink: 0; }
    .panel-title { margin: 0; font-weight: 800; font-size: 26px; line-height: 1.3; overflow-wrap: anywhere; }
    .panel-date { font-family: var(--font-latin); font-size: 13px; color: var(--muted); margin-top: 6px; display: block; }
    .panel-summary { margin: 0; overflow-wrap: anywhere; font-size: 15px; line-height: 1.75; background: var(--mint-soft); border-radius: 18px; padding: 14px 16px; }
    .panel-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .panel-tags span { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; transform: rotate(var(--rot, 0deg)); }
    .panel-raw {
      font-size: 15px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--cream); border-radius: 18px; padding: 14px 16px;
    }
    .panel-raw a { color: #9A3412; }
    .panel-images { display: flex; flex-direction: column; gap: 10px; }
    .panel-images img { width: 100%; border-radius: 18px; display: block; }
    .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .panel-actions .push { margin-left: auto; }
    .pill.danger:hover, .pill.danger.confirm { background: #B91C1C; border-color: #B91C1C; color: var(--white); }

    .tm-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tm-hint { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
    .tm-list { display: flex; flex-direction: column; gap: 8px; }
    .tm-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--cream); border-radius: 18px; padding: 8px 10px;
    }
    .tm-name { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 4px 10px; font-weight: 800; font-size: 14px; }
    .tm-name .cnt { font-family: var(--font-latin); font-weight: 500; font-size: 12px; background: var(--white); border-radius: 999px; padding: 0 7px; }
    .tm-row form { display: flex; gap: 6px; flex: 1; min-width: 200px; margin-left: auto; }
    .tm-row input {
      flex: 1; min-width: 0; font-size: 14px; padding: 8px 12px; border-radius: 999px;
      border: 2px solid var(--line); background: var(--white); outline: none;
    }
    .tm-row input:focus { border-color: var(--ink); }
    .tm-row .pill { min-height: 38px; padding: 6px 12px; font-size: 13px; }
    .edit-form { display: flex; flex-direction: column; gap: 12px; }
    .edit-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
    .edit-form .hint { font-weight: 500; color: var(--muted); }
    .edit-form input, .edit-form textarea {
      font-size: 15px; padding: 12px 14px; border-radius: 16px;
      border: 2px solid var(--line); background: var(--cream); outline: none;
    }
    .edit-form input:focus, .edit-form textarea:focus { border-color: var(--ink); }
    .edit-form textarea { min-height: 110px; resize: vertical; line-height: 1.6; }

    /* ===== Login ===== */
    .login-screen {
      position: fixed; inset: 0; z-index: 3000; background: var(--cream);
      display: none; align-items: center; justify-content: center; padding: 16px; overflow: hidden;
    }
    .login-screen.open { display: flex; }
    .login-box {
      position: relative; z-index: 1; width: min(360px, 100%);
      background: var(--white); border: 2px solid var(--ink); border-radius: 32px;
      padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center;
    }
    .login-box .home-mark { margin: 0 auto; }
    .login-box h1 { margin: 0; font-family: var(--font); font-weight: 800; font-size: 30px; letter-spacing: 1px; }
    .login-box input {
      padding: 14px 18px; border-radius: 999px; border: 2px solid var(--line);
      background: var(--cream); font-size: 16px; outline: none; text-align: center;
    }
    .login-box input:focus { border-color: var(--ink); }
    .login-box .pill { min-height: 52px; font-size: 16px; }
    .login-error { color: #B91C1C; font-size: 14px; font-weight: 700; min-height: 20px; }

    /* ===== Animations ===== */
    @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255, 246, 229, .35); border-top-color: var(--cream);
      animation: spin .8s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .wrap { padding: 28px 16px 80px; gap: 22px; }
      .home-title { font-size: 34px; }
      .home-mark { width: 50px; height: 50px; border-radius: 16px; }
      .search-box { border-radius: 26px; padding: 14px; }
      .search-row .pill { padding: 0 20px; }
      .cards { grid-template-columns: minmax(0, 1fr); }
      .card:hover { transform: none; }
      .blob-a { width: 300px; height: 300px; top: -150px; right: -120px; }
      .blob-b { display: none; }
      .panel { border-radius: 28px; padding: 12px; }
      .panel-media { height: 200px; border-radius: 20px; }
      .panel-main { padding: 4px 6px 8px; }
      .panel-close { top: 8px; right: 8px; }
    }
    @media (max-width: 520px) {
      .overlay { padding: 10px; }
      .panel { max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px); border-radius: 24px; padding: 10px; }
      .panel-media { height: 180px; border-radius: 16px; }
      .panel-title { font-size: 22px; }
      .panel-head { flex-direction: column; align-items: flex-start; gap: 10px; }
      .panel-head > div { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>

  <!-- 登入 -->
  <div id="loginScreen" class="login-screen">
    <div class="blob blob-a" aria-hidden="true"></div>
    <form id="loginForm" class="login-box">
      <span class="home-mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </span>
      <h1>書書小口袋</h1>
      <label class="sr-only" for="loginPassword">密碼</label>
      <input id="loginPassword" type="password" placeholder="請輸入密碼" autocomplete="current-password" required />
      <button type="submit" id="loginBtn" class="pill pill-ink">登入</button>
      <div id="loginError" class="login-error" role="alert"></div>
    </form>
  </div>

  <div class="wrap">
    <header class="top">
      <a href="/" id="homeLink" class="home" aria-label="書書小口袋，回到首頁">
        <span class="home-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        </span>
        <span class="home-text">
          <span class="home-title">書書小口袋</span>
        </span>
      </a>
      <div class="top-actions">
        <span id="resultInfo" class="count-pill"></span>
        <button id="logoutBtn" class="pill" type="button">登出</button>
      </div>
    </header>

    <section class="search-box" aria-label="搜尋與篩選">
      <form id="searchForm" class="search-row" role="search">
        <label class="sr-only" for="searchInput">搜尋知識庫</label>
        <div class="search-field">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="searchInput" type="search" placeholder="想找什麼？標題、內容、標籤都可以" title="多個關鍵字用空白分隔" />
        </div>
        <button id="searchBtn" class="pill pill-ink" type="submit">搜尋</button>
      </form>
      <div class="filter-row">
        <div class="type-group" id="typeGroup" role="group" aria-label="類型">
          <button class="type-btn" type="button" data-type="">全部</button>
          <button class="type-btn" type="button" data-type="image">有圖</button>
          <button class="type-btn" type="button" data-type="link">有連結</button>
          <button class="type-btn" type="button" data-type="text">純文字</button>
        </div>
        <div class="active-filters" id="activeFilters"></div>
      </div>
    </section>

    <section id="resurface" class="resurface" aria-label="重溫" hidden></section>

    <div id="reindexBar" class="reindex-bar" role="status" hidden>
      <span id="reindexText"></span>
      <button id="reindexBtn" class="pill pill-ink" type="button">開始建立</button>
    </div>

    <nav id="tagNav" class="tag-nav" aria-label="標籤（可複選）"></nav>

    <div id="aiBar" class="ai-bar" hidden>
      <button id="aiBtn" class="pill pill-coral ai-btn" type="button">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
        請 AI 整理這些結果
      </button>
    </div>
    <section id="aiCard" class="ai-card" aria-label="AI 整理" aria-live="polite" hidden></section>

    <main>
      <div id="cards" class="cards"></div>
      <div id="sentinel"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="overlay" class="overlay" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-close-wrap">
        <button id="panelClose" class="panel-close" type="button" aria-label="關閉">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A2F" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </div>
  </div>

<script>
  /* ========= DOM ========= */
  const $ = (id) => document.getElementById(id);
  const searchInput = $("searchInput");
  const searchBtn = $("searchBtn");
  const cardsEl = $("cards");
  const tagNavEl = $("tagNav");
  const activeFiltersEl = $("activeFilters");
  const resultInfoEl = $("resultInfo");
  const typeGroupEl = $("typeGroup");
  const sentinelEl = $("sentinel");
  const overlayEl = $("overlay");
  const backdropEl = $("backdrop");
  const panelEl = $("panel");
  const panelBody = $("panelBody");
  const toastEl = $("toast");

  const TAG_COLOR = {
    "親子": "#FFC8A6", "教育": "#FFE27A", "AI": "#BFE0FF", "資訊": "#BFE0FF", "健康": "#BDEBD3",
    "旅遊": "#FFE27A", "趣味": "#FFC8A6", "購物": "#FFD6E0", "興趣": "#BDEBD3",
  };
  const CUSTOM_TAG_COLOR = "#EFE8D8";
  const MEDIA_COLORS = ["#FFC8A6", "#FFE27A", "#BDEBD3", "#BFE0FF", "#FFD6E0"];
  const ROTS = ["-3deg", "2deg", "-1.5deg", "3deg", "-2.5deg", "1deg"];
  const PAGE_SIZE = 30;
  const TOP_TAGS = 12;
  const URL_RE = /(https?:\/\/[^\s<>"'）)】]+)/g;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ========= 狀態 ========= */
  const state = { q: "", tags: [], type: "", items: [], total: 0, loading: false, reqId: 0 };
  let tagCounts = [];
  let tagsExpanded = false;
  let currentRow = null;
  let panelAnimating = false;
  let panelSource = null; // 打開面板的來源元素（卡片或重溫卡）

  /* ========= 小工具 ========= */
  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "style") node.style.cssText = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) if (c != null && c !== false) node.append(c);
    return node;
  }

  function svgIcon(path, size = 14) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("width", size); svg.setAttribute("height", size);
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2.6");
    svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(ns, "path"); p.setAttribute("d", path);
    svg.append(p);
    return svg;
  }
  const ICON_X = "M6 6l12 12M18 6L6 18";
  const ICON_LINK = "M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1";

  let toastTimer;
  function toast(text, ms = 1800) {
    clearTimeout(toastTimer);
    toastEl.textContent = text;
    toastEl.classList.add("show");
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
  }

  function fmtTime(iso) {
    return iso ? new Date(iso).toLocaleString("zh-TW", {
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
    }) : "";
  }

  function tagColor(t) { return TAG_COLOR[t] || CUSTOM_TAG_COLOR; }
  function images(row) { return (Array.isArray(row.attachments) ? row.attachments : []).filter(a => a?.type === "image" && a.url); }
  function hasLink(row) { return /https?:\/\//i.test(row.raw_text || ""); }
  function mediaColor(row) { return MEDIA_COLORS[Math.abs(Number(row.id) || 0) % MEDIA_COLORS.length]; }
  function searchTerms() { return state.q.split(/\s+/).filter(Boolean); }

  // 關鍵字用 <mark> 標示（不使用 innerHTML，避免 XSS）
  function setHighlighted(node, text) {
    node.textContent = "";
    const terms = searchTerms();
    if (!terms.length || !text) { node.textContent = text || ""; return; }
    const re = new RegExp(`(${terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
    text.split(re).forEach((part, i) => node.append(i % 2 ? el("mark", { text: part }) : document.createTextNode(part)));
  }

  function setLinkified(node, text) {
    node.textContent = "";
    (text || "").split(URL_RE).forEach((part, i) => {
      node.append(i % 2
        ? el("a", { href: part, target: "_blank", rel: "noopener noreferrer", text: part })
        : document.createTextNode(part));
    });
  }

  // 關鍵字只出現在原文時，擷取一小段讓人知道為什麼被搜到
  function rawSnippet(row) {
    const terms = searchTerms().map(t => t.toLowerCase());
    if (!terms.length || !row.raw_text) return null;
    const hay = `${row.title || ""} ${row.summary || ""}`.toLowerCase();
    if (terms.every(t => hay.includes(t))) return null;
    const raw = row.raw_text.replace(/\s+/g, " ");
    const idx = Math.min(...terms.map(t => raw.toLowerCase().indexOf(t)).filter(i => i >= 0));
    if (!isFinite(idx)) return null;
    const start = Math.max(0, idx - 20);
    return (start > 0 ? "…" : "") + raw.slice(start, start + 70) + (start + 70 < raw.length ? "…" : "");
  }

  /* ========= API ========= */
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
      credentials: "same-origin",
    });
    if (res.status === 401 && path !== "/api/session") { showLogin(); throw new Error("unauthorized"); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    return json;
  }

  /* ========= 登入 ========= */
  function showLogin() {
    $("loginScreen").classList.add("open");
    setTimeout(() => $("loginPassword").focus(), 50);
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("loginBtn");
    btn.disabled = true; $("loginError").textContent = "";
    try {
      await api("/api/session", { method: "POST", body: JSON.stringify({ password: $("loginPassword").value }) });
      $("loginScreen").classList.remove("open");
      $("loginPassword").value = "";
      start();
    } catch (err) {
      $("loginError").textContent = err.message || "登入失敗";
    }
    btn.disabled = false;
  });

  $("logoutBtn").addEventListener("click", async () => {
    await api("/api/session", { method: "DELETE" }).catch(() => {});
    closePanel(true);
    cardsEl.innerHTML = ""; tagNavEl.innerHTML = ""; resultInfoEl.textContent = "";
    showLogin();
  });

  /* ========= URL 狀態 ========= */
  function readUrl() {
    const p = new URLSearchParams(location.search);
    state.q = p.get("q") || "";
    state.tags = (p.get("tags") || "").split(",").map(s => s.trim()).filter(Boolean);
    state.type = p.get("type") || "";
  }

  function writeUrl(push) {
    const p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.tags.length) p.set("tags", state.tags.join(","));
    if (state.type) p.set("type", state.type);
    const qs = p.toString();
    if ((qs ? `?${qs}` : "") === location.search) return;
    history[push ? "pushState" : "replaceState"](null, "", qs ? `?${qs}` : location.pathname);
  }

  window.addEventListener("popstate", () => { closePanel(true); readUrl(); search(false); });

  /* ========= 標題 → 首頁 ========= */
  $("homeLink").addEventListener("click", (e) => {
    e.preventDefault();
    closePanel(true);
    state.q = ""; state.tags = []; state.type = "";
    search(true);
  });

  /* ========= 篩選 ========= */
  function renderFilters() {
    searchInput.value = state.q;
    typeGroupEl.querySelectorAll(".type-btn").forEach(b => {
      const on = b.dataset.type === state.type;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on);
    });
    activeFiltersEl.innerHTML = "";
    state.tags.forEach(t => {
      activeFiltersEl.append(el("button", {
        class: "filter-chip", type: "button", "aria-label": `移除標籤 ${t}`, onclick: () => toggleTag(t),
      }, [t, svgIcon(ICON_X, 12)]));
    });
    if (state.q || state.tags.length || state.type) {
      activeFiltersEl.append(el("button", { class: "clear-btn", type: "button", text: "清除全部", onclick: clearAll }));
    }
  }

  function toggleTag(tag) {
    state.tags = state.tags.includes(tag) ? state.tags.filter(t => t !== tag) : [...state.tags, tag];
    search(true);
  }

  function clearAll() {
    state.q = ""; state.tags = []; state.type = "";
    search(true);
  }

  typeGroupEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".type-btn");
    if (!btn) return;
    state.type = btn.dataset.type;
    search(true);
  });

  $("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    state.q = searchInput.value.trim();
    search(true);
  });

  /* ========= 標籤貼紙（全庫統計） ========= */
  async function loadTags() {
    try {
      const json = await api("/api/tags");
      tagCounts = json.data || [];
    } catch (e) { if (e.message !== "unauthorized") console.error(e); }
    renderTagNav();
  }

  function sticker(tag, count, i) {
    const on = state.tags.includes(tag);
    const btn = el("button", {
      class: "sticker" + (on ? " active" : ""), type: "button", "aria-pressed": on,
      onclick: () => toggleTag(tag),
    }, [tag, count != null ? el("span", { class: "cnt", text: count }) : null]);
    btn.style.background = tagColor(tag);
    btn.style.setProperty("--rot", ROTS[i % ROTS.length]);
    return btn;
  }

  function renderTagNav() {
    tagNavEl.innerHTML = "";
    const known = new Set(tagCounts.map(t => t.tag));
    const list = [...tagCounts, ...state.tags.filter(t => !known.has(t)).map(t => ({ tag: t, count: 0 }))];
    const activeHidden = list.slice(TOP_TAGS).some(t => state.tags.includes(t.tag));
    const showAll = tagsExpanded || activeHidden;
    const shown = showAll ? list : list.slice(0, TOP_TAGS);
    shown.forEach(({ tag, count }, i) => tagNavEl.append(sticker(tag, count, i)));
    if (list.length > TOP_TAGS) {
      tagNavEl.append(el("button", {
        class: "more-btn", type: "button",
        text: showAll ? "收起" : `還有 ${list.length - TOP_TAGS} 個標籤`,
        onclick: () => { tagsExpanded = !showAll; renderTagNav(); },
      }));
    }
    tagNavEl.append(el("button", { class: "more-btn", type: "button", text: "整理標籤", onclick: openTagManager }));
  }

  /* ========= 卡片 ========= */
  function buildCard(row, index) {
    const card = el("article", { class: "card" + (row.pinned ? " pinned" : ""), "data-id": row.id });
    card.style.animationDelay = `${(index % PAGE_SIZE) * 0.03}s`;
    if (currentRow && String(currentRow.id) === String(row.id)) card.style.visibility = "hidden";

    if (row.pinned) card.append(el("span", { class: "pin-sticker", text: "置頂" }));
    const citeNo = ai.numbers.get(String(row.id));
    if (citeNo) card.append(el("span", { class: "cite-badge", text: citeNo, "aria-label": `AI 整理第 ${citeNo} 則` }));

    const img = images(row)[0];
    if (img) {
      const media = el("div", { class: "card-media", "aria-hidden": "true" }, [
        el("img", { src: `${img.url}?width=640`, loading: "lazy", alt: "" }),
      ]);
      media.style.background = mediaColor(row);
      card.append(media);
    }

    const body = el("div", { class: "card-body" });
    const openBtn = el("button", { class: "card-open", type: "button" });
    setHighlighted(openBtn, row.title || "無標題記錄");
    openBtn.addEventListener("click", () => openPanel(row, card));
    body.append(openBtn);

    if (row.summary) {
      const summary = el("p", { class: "card-summary" });
      setHighlighted(summary, row.summary);
      body.append(summary);
    }

    if (row._match === "semantic") {
      body.append(el("span", { class: "sem-badge", title: "沒有完全符合的字，但意思相近" }, ["意思相近"]));
    }

    const snip = row._match === "semantic" ? null : rawSnippet(row);
    if (snip) {
      const p = el("p", { class: "card-snippet" });
      setHighlighted(p, snip);
      body.append(p);
    }

    const tags = Array.isArray(row.tags) ? row.tags : [];
    const tagsDiv = el("div", { class: "card-tags" });
    tags.forEach((t, i) => {
      const on = state.tags.includes(t);
      const b = el("button", {
        class: "mini-tag" + (on ? " active" : ""), type: "button", text: t,
        title: on ? "取消這個標籤" : "加入標籤篩選",
        onclick: (e) => { e.stopPropagation(); toggleTag(t); },
      });
      b.style.background = tagColor(t);
      b.style.setProperty("--rot", ROTS[i % ROTS.length]);
      tagsDiv.append(b);
    });
    const date = el("span", { class: "card-date" }, [
      hasLink(row) ? el("span", { title: "含連結", style: "display:inline-flex" }, [svgIcon(ICON_LINK, 13)]) : null,
      fmtTime(row.created_at),
    ]);
    body.append(el("div", { class: "card-foot" }, [tagsDiv, date]));
    card.append(body);
    return card;
  }

  function renderCards(fromIndex = 0) {
    queueMicrotask(updateAiBar);
    if (fromIndex === 0) cardsEl.innerHTML = "";
    cardsEl.querySelector(".load-more-wrap")?.remove();
    cardsEl.querySelector(".empty")?.remove();

    if (!state.items.length) {
      const filtered = state.q || state.tags.length || state.type;
      cardsEl.append(el("p", { class: "empty",
        text: filtered ? "沒有符合的記錄，試試減少篩選條件。" : "這裡還空空的，從 Telegram 丟點東西進來吧。" }));
    } else {
      state.items.slice(fromIndex).forEach((row, i) => cardsEl.append(buildCard(row, fromIndex + i)));
      if (state.items.length < state.total) {
        cardsEl.append(el("div", { class: "load-more-wrap" }, [
          el("button", { class: "pill pill-white", type: "button",
            text: `載入更多（還有 ${state.total - state.items.length} 筆）`, onclick: loadPage }),
        ]));
      }
    }
    const filtered = state.q || state.tags.length || state.type;
    resultInfoEl.textContent = state.loading && !state.items.length ? "" : (filtered ? `找到 ${state.total} 筆` : `共 ${state.total} 筆`);
  }

  function findCardEl(id) {
    return cardsEl.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);
  }

  /* ========= 資料載入 ========= */
  function search(push) {
    state.items = []; state.total = 0;
    resetAi();
    writeUrl(push);
    updateResurface();
    renderFilters();
    renderTagNav();
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    loadPage();
  }

  async function loadPage() {
    if (state.loading && state.items.length) return;
    const myReq = ++state.reqId;
    state.loading = true;
    const first = state.items.length === 0;
    if (first) { searchBtn.disabled = true; searchBtn.innerHTML = '<span class="spinner"></span>'; }

    const p = new URLSearchParams({ limit: PAGE_SIZE, offset: state.items.length });
    if (state.q) p.set("q", state.q);
    if (state.tags.length) p.set("tags", state.tags.join(","));
    if (state.type) p.set("type", state.type);

    try {
      const json = await api(`/api/notes?${p}`);
      if (myReq !== state.reqId) return;
      const from = state.items.length;
      state.items.push(...(json.data || []));
      state.total = json.total || 0;
      state.loading = false;
      renderCards(from);
    } catch (err) {
      if (myReq !== state.reqId || err.message === "unauthorized") return;
      console.error(err);
      toast("載入失敗：" + err.message, 4000);
    } finally {
      if (myReq === state.reqId) {
        state.loading = false;
        searchBtn.textContent = "搜尋";
        searchBtn.disabled = false;
      }
    }
  }

  new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !state.loading && state.items.length && state.items.length < state.total) loadPage();
  }, { rootMargin: "400px" }).observe(sentinelEl);

  /* ========= 展開卡片（容器變形動畫） ========= */
  const OPEN_MS = 460, CLOSE_MS = 360;
  const EASE_OPEN = "cubic-bezier(.2, .9, .25, 1)";
  const EASE_CLOSE = "cubic-bezier(.4, 0, .2, 1)";

  function rectStyle(r, radius) {
    return { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, borderRadius: `${radius}px` };
  }

  function pinPanel(r) {
    panelEl.style.position = "fixed";
    panelEl.style.margin = "0";
    panelEl.style.left = `${r.left}px`; panelEl.style.top = `${r.top}px`;
    panelEl.style.width = `${r.width}px`; panelEl.style.height = `${r.height}px`;
    panelEl.style.maxHeight = "none";
  }

  function unpinPanel() {
    ["position", "margin", "left", "top", "width", "height", "maxHeight", "visibility"].forEach(k => { panelEl.style[k] = ""; });
    panelEl.classList.remove("morphing");
  }

  // 依照置中後的最終大小量測
  function measureFinalRect() {
    unpinPanel();
    panelEl.style.visibility = "hidden";
    const r = panelEl.getBoundingClientRect();
    panelEl.style.visibility = "";
    return { left: r.left, top: r.top, width: r.width, height: r.height };
  }

  function openPanel(row, cardEl) {
    if (panelAnimating) return;
    currentRow = row;
    renderPanelView();
    overlayEl.hidden = false;
    document.body.style.overflow = "hidden";

    const to = measureFinalRect();
    const from = cardEl?.getBoundingClientRect();
    const canMorph = !reduceMotion && from && from.bottom > 0 && from.top < innerHeight;

    if (cardEl) cardEl.style.visibility = "hidden";
    panelSource = cardEl || null;
    $("panelClose").focus({ preventScroll: true });

    if (!canMorph) {
      backdropEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
      return;
    }

    panelAnimating = true;
    panelEl.classList.add("morphing");
    pinPanel(to);
    backdropEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: OPEN_MS * .7, easing: "ease-out" });
    const anim = panelEl.animate([rectStyle(from, 28), rectStyle(to, 36)], { duration: OPEN_MS, easing: EASE_OPEN });

    // 圖片高度與內容淡入
    const media = panelBody.querySelector(".panel-media");
    const cardMedia = cardEl.querySelector(".card-media");
    if (media && cardMedia) {
      media.animate([{ height: `${cardMedia.offsetHeight}px`, borderRadius: "20px" }, { height: getComputedStyle(media).height, borderRadius: getComputedStyle(media).borderRadius }],
        { duration: OPEN_MS, easing: EASE_OPEN });
    }
    panelBody.querySelectorAll(".fade-in").forEach((n) => {
      n.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }],
        { duration: 260, delay: OPEN_MS * .45, easing: "ease-out", fill: "backwards" });
    });
    $("panelClose").animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }],
      { duration: 240, delay: OPEN_MS * .5, easing: "ease-out", fill: "backwards" });

    anim.onfinish = anim.oncancel = () => { unpinPanel(); panelAnimating = false; };
  }

  function closePanel(instant = false) {
    if (overlayEl.hidden || (panelAnimating && !instant)) return;
    const id = currentRow?.id;
    const cardEl = (panelSource && panelSource.isConnected) ? panelSource : (id != null ? findCardEl(id) : null);

    const finish = () => {
      overlayEl.hidden = true;
      unpinPanel();
      panelEl.getAnimations({ subtree: true }).forEach(a => a.cancel());
      backdropEl.getAnimations().forEach(a => a.cancel());
      panelBody.innerHTML = "";
      document.body.style.overflow = "";
      currentRow = null;
      panelAnimating = false;
      if (panelSource) { panelSource.style.visibility = ""; panelSource = null; }
      if (cardEl) {
        cardEl.style.visibility = "";
        if (!instant) cardEl.querySelector(".card-open")?.focus({ preventScroll: true });
      }
    };

    if (instant || reduceMotion) return finish();

    const from = panelEl.getBoundingClientRect();
    const to = cardEl?.getBoundingClientRect();
    const onScreen = to && to.bottom > 0 && to.top < innerHeight;
    panelAnimating = true;
    backdropEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: CLOSE_MS, easing: "ease-in", fill: "forwards" });

    if (!onScreen) {
      panelEl.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.94)" }],
        { duration: 200, easing: "ease-in", fill: "forwards" }).onfinish = finish;
      return;
    }

    panelEl.scrollTop = 0;
    panelEl.classList.add("morphing");
    pinPanel(from);
    panelBody.querySelectorAll(".fade-in").forEach((n) => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: "forwards" }));
    $("panelClose").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 100, fill: "forwards" });
    const media = panelBody.querySelector(".panel-media");
    const cardMedia = cardEl.querySelector(".card-media");
    if (media && cardMedia) {
      media.animate([{ height: getComputedStyle(media).height }, { height: `${cardMedia.offsetHeight}px`, borderRadius: "20px" }],
        { duration: CLOSE_MS, easing: EASE_CLOSE, fill: "forwards" });
    }
    panelEl.animate([rectStyle(from, 36), rectStyle(to, 28)], { duration: CLOSE_MS, easing: EASE_CLOSE, fill: "forwards" }).onfinish = finish;
  }

  $("panelClose").addEventListener("click", () => closePanel());
  backdropEl.addEventListener("click", () => closePanel());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlayEl.hidden) closePanel(); });

  function replaceItem(updated) {
    const i = state.items.findIndex(r => String(r.id) === String(updated.id));
    if (i !== -1) state.items[i] = { ...state.items[i], ...updated };
    return i !== -1 ? state.items[i] : updated;
  }

  function renderPanelView() {
    const row = currentRow;
    panelBody.innerHTML = "";
    const imgs = images(row);

    if (imgs.length) {
      const media = el("div", { class: "panel-media" }, [
        el("a", { href: imgs[0].url, target: "_blank", rel: "noopener", "aria-label": "開啟原圖" },
          [el("img", { src: `${imgs[0].url}?width=1200`, alt: "" })]),
      ]);
      media.style.background = mediaColor(row);
      panelBody.append(media);
    }

    const copyBtn = el("button", { class: "pill pill-coral", type: "button", text: "複製內容" });
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(row.raw_text || "").then(() => {
        copyBtn.textContent = "已複製";
        setTimeout(() => { copyBtn.textContent = "複製內容"; }, 1800);
      }).catch(() => toast("複製失敗"));
    });

    const head = el("div", { class: "panel-head" }, [
      el("div", {}, [
        el("h2", { class: "panel-title", id: "panelTitle", text: row.title || "無標題記錄" }),
        el("span", { class: "panel-date", text: `${row.pinned ? "已置頂 · " : ""}${fmtTime(row.created_at)}` }),
      ]),
      copyBtn,
    ]);

    const rest = [];
    if (row.summary) rest.push(el("p", { class: "panel-summary", text: row.summary }));
    const tags = Array.isArray(row.tags) ? row.tags : [];
    if (tags.length) {
      rest.push(el("div", { class: "panel-tags" }, tags.map((t, i) => {
        const s = el("span", { text: t });
        s.style.background = tagColor(t);
        s.style.setProperty("--rot", ROTS[i % ROTS.length]);
        return s;
      })));
    }
    const raw = el("div", { class: "panel-raw" });
    setLinkified(raw, row.raw_text || "無原始內容");
    rest.push(raw);
    if (imgs.length > 1) {
      rest.push(el("div", { class: "panel-images" }, imgs.slice(1).map(a =>
        el("a", { href: a.url, target: "_blank", rel: "noopener" }, [el("img", { src: `${a.url}?width=1200`, alt: "", loading: "lazy" })]))));
    }

    // 動作列
    const pinBtn = el("button", { class: "pill pill-white", type: "button", text: row.pinned ? "取消置頂" : "置頂" });
    pinBtn.addEventListener("click", async () => {
      pinBtn.disabled = true;
      try {
        const { data } = await api(`/api/notes?id=${encodeURIComponent(row.id)}`, {
          method: "PATCH", body: JSON.stringify({ pinned: !row.pinned }),
        });
        currentRow = replaceItem(data);
        renderPanelView();
        toast(data.pinned ? "已置頂" : "已取消置頂");
        reloadKeepPanel();
      } catch (e) { toast(e.message, 3000); pinBtn.disabled = false; }
    });

    const editBtn = el("button", { class: "pill pill-white", type: "button", text: "編輯", onclick: renderPanelEdit });

    const delBtn = el("button", { class: "pill pill-white danger push", type: "button", text: "刪除" });
    let confirmTimer;
    delBtn.addEventListener("click", async () => {
      if (!delBtn.classList.contains("confirm")) {
        delBtn.classList.add("confirm"); delBtn.textContent = "確定刪除？";
        confirmTimer = setTimeout(() => { delBtn.classList.remove("confirm"); delBtn.textContent = "刪除"; }, 3000);
        return;
      }
      clearTimeout(confirmTimer);
      delBtn.disabled = true;
      try {
        await api(`/api/notes?id=${encodeURIComponent(row.id)}`, { method: "DELETE" });
        state.items = state.items.filter(r => String(r.id) !== String(row.id));
        state.total = Math.max(0, state.total - 1);
        findCardEl(row.id)?.remove();
        closePanel();
        renderCards(0);
        loadTags();
        toast("已刪除");
      } catch (e) { toast(e.message, 3000); delBtn.disabled = false; }
    });
    rest.push(el("div", { class: "panel-actions" }, [pinBtn, editBtn, delBtn]));

    rest.forEach(n => n.classList.add("fade-in"));
    const related = el("section", { class: "related fade-in", "aria-label": "相關筆記" }, [
      el("h3", { text: "相關筆記" }),
      el("p", { class: "related-empty", text: "尋找中…" }),
    ]);
    panelBody.append(el("div", { class: "panel-main" }, [head, ...rest, related]));
    loadRelated(row, related);
  }

  function renderPanelEdit() {
    const row = currentRow;
    panelBody.innerHTML = "";

    const titleIn = el("input", { type: "text", maxlength: "200", id: "editTitle" }); titleIn.value = row.title || "";
    const summaryIn = el("textarea", { maxlength: "2000", id: "editSummary" }); summaryIn.value = row.summary || "";
    const tagsIn = el("input", { type: "text", id: "editTags" }); tagsIn.value = (Array.isArray(row.tags) ? row.tags : []).join(", ");

    const saveBtn = el("button", { class: "pill pill-ink", type: "submit", text: "儲存" });
    const cancelBtn = el("button", { class: "pill pill-white", type: "button", text: "取消", onclick: renderPanelView });

    const form = el("form", { class: "edit-form" }, [
      el("label", { for: "editTitle" }, ["標題", titleIn]),
      el("label", { for: "editSummary" }, ["摘要", summaryIn]),
      el("label", { for: "editTags" }, [el("span", {}, ["標籤 ", el("span", { class: "hint", text: "（用逗號或空白分隔）" })]), tagsIn]),
      el("div", { class: "panel-actions" }, [cancelBtn, saveBtn]),
    ]);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      const tags = tagsIn.value.split(/[,，、\s]+/).map(s => s.trim().replace(/^#/, "")).filter(Boolean);
      try {
        const { data } = await api(`/api/notes?id=${encodeURIComponent(row.id)}`, {
          method: "PATCH", body: JSON.stringify({ title: titleIn.value, summary: summaryIn.value, tags }),
        });
        currentRow = replaceItem(data);
        renderCards(0);
        loadTags();
        renderPanelView();
        toast("已儲存");
      } catch (err) { toast(err.message, 3000); saveBtn.disabled = false; }
    });

    panelBody.append(el("div", { class: "panel-main" }, [
      el("div", { class: "panel-head" }, [el("h2", { class: "panel-title", id: "panelTitle", text: "編輯記錄" })]),
      form,
    ]));
    titleIn.focus();
  }

  // 置頂後排序會變：重新載入清單，但保持彈窗開著
  function reloadKeepPanel() {
    state.items = []; state.total = 0;
    loadPage();
  }

  /* ========= 整理標籤 ========= */
  let tmFilter = "all";

  function openTagManager() {
    if (panelAnimating) return;
    currentRow = null;
    renderTagManager();
    overlayEl.hidden = false;
    document.body.style.overflow = "hidden";
    if (!reduceMotion) {
      backdropEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
      panelEl.animate([{ opacity: 0, transform: "translateY(20px) scale(.97)" }, { opacity: 1, transform: "none" }],
        { duration: 320, easing: "cubic-bezier(.3, 1.3, .5, 1)" });
    }
    $("panelClose").focus({ preventScroll: true });
  }

  async function tagAction(fn, okText) {
    try {
      const r = await fn();
      toast(`${okText}（影響 ${r.changed ?? 0} 則筆記）`, 2400);
      await loadTags();
      renderTagManager();
      state.items = []; state.total = 0;
      writeUrl(false); renderFilters();
      loadPage();
    } catch (e) { toast(e.message, 3000); renderTagManager(); }
  }

  function renderTagManager() {
    panelBody.innerHTML = "";
    const list = tmFilter === "rare" ? tagCounts.filter(t => t.count <= 1) : tagCounts;
    const rareCount = tagCounts.filter(t => t.count <= 1).length;

    const dl = el("datalist", { id: "tmTagList" }, tagCounts.map(t => el("option", { value: t.tag })));

    const filterBtn = (key, label) => {
      const b = el("button", { class: "type-btn" + (tmFilter === key ? " active" : ""), type: "button", text: label,
        "aria-pressed": tmFilter === key, onclick: () => { tmFilter = key; renderTagManager(); } });
      return b;
    };

    const rows = list.map(({ tag, count }) => {
      const name = el("span", { class: "tm-name" }, [tag, el("span", { class: "cnt", text: count })]);
      name.style.background = tagColor(tag);

      const input = el("input", { type: "text", list: "tmTagList", placeholder: "改名，或輸入既有標籤來合併", "aria-label": `${tag} 改名或合併為` });
      const apply = el("button", { class: "pill pill-ink", type: "submit", text: "套用" });
      const form = el("form", {}, [input, apply]);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const to = input.value.trim().replace(/^#/, "");
        if (!to || to === tag) return;
        const merging = tagCounts.some(t => t.tag === to);
        apply.disabled = true;
        state.tags = state.tags.map(t => (t === tag ? to : t)).filter((t, i, a) => a.indexOf(t) === i);
        tagAction(() => api("/api/tags", { method: "PATCH", body: JSON.stringify({ from: tag, to }) }),
          merging ? `已把「${tag}」合併到「${to}」` : `已改名為「${to}」`);
      });

      const del = el("button", { class: "pill pill-white danger", type: "button", text: "刪除" });
      let timer;
      del.addEventListener("click", () => {
        if (!del.classList.contains("confirm")) {
          del.classList.add("confirm"); del.textContent = "確定？";
          timer = setTimeout(() => { del.classList.remove("confirm"); del.textContent = "刪除"; }, 3000);
          return;
        }
        clearTimeout(timer); del.disabled = true;
        state.tags = state.tags.filter(t => t !== tag);
        tagAction(() => api(`/api/tags?tag=${encodeURIComponent(tag)}`, { method: "DELETE" }), `已刪除「${tag}」`);
      });

      return el("div", { class: "tm-row" }, [name, form, del]);
    });

    panelBody.append(el("div", { class: "panel-main" }, [
      el("div", { class: "panel-head" }, [el("div", {}, [
        el("h2", { class: "panel-title", id: "panelTitle", text: "整理標籤" }),
        el("span", { class: "panel-date", text: `共 ${tagCounts.length} 個標籤` }),
      ])]),
      el("p", { class: "tm-hint", text: "改名：輸入新名稱。合併：輸入一個已經存在的標籤，兩者會併成一個。刪除：只會把標籤從筆記上拿掉，筆記本身不會被刪。" }),
      el("div", { class: "tm-tools" }, [filterBtn("all", "全部"), filterBtn("rare", `只用過 1 次（${rareCount}）`)]),
      dl,
      el("div", { class: "tm-list" }, rows.length ? rows : [el("p", { class: "tm-hint", text: "沒有符合的標籤。" })]),
    ]));
  }

  /* ========= 啟動 ========= */
  /* ========= 相關筆記 ========= */
  async function loadRelated(row, section) {
    let list = [];
    try { list = (await api(`/api/related?id=${encodeURIComponent(row.id)}&limit=5`)).data || []; }
    catch (e) { if (e.message === "unauthorized") return; }
    if (!section.isConnected || !currentRow || String(currentRow.id) !== String(row.id)) return;
    section.querySelector(".related-empty")?.remove();
    if (!list.length) {
      section.append(el("p", { class: "related-empty", text: "還沒有找到相近的筆記。" }));
      return;
    }
    section.append(el("div", { class: "related-list" }, list.map((r) => {
      const img = images(r)[0];
      const thumb = el("span", { class: "related-thumb", "aria-hidden": "true" },
        img ? [el("img", { src: `${img.url}?width=160`, alt: "", loading: "lazy" })] : []);
      thumb.style.background = mediaColor(r);
      const tags = (Array.isArray(r.tags) ? r.tags : []).slice(0, 3).join("、");
      return el("button", { class: "related-item", type: "button", onclick: () => switchPanelTo(r) }, [
        thumb,
        el("span", { class: "related-text" }, [
          el("span", { class: "related-title", text: r.title || "無標題記錄" }),
          el("span", { class: "related-meta", text: [tags, fmtTime(r.created_at)].filter(Boolean).join(" · ") }),
        ]),
      ]);
    })));
  }

  // 在已開啟的面板中切換到另一則筆記
  function switchPanelTo(row) {
    const prev = currentRow && findCardEl(currentRow.id);
    if (prev) prev.style.visibility = "";
    if (panelSource) { panelSource.style.visibility = ""; panelSource = null; }
    const inList = state.items.find(r => String(r.id) === String(row.id));
    currentRow = inList ? { ...row, ...inList } : row;
    const next = findCardEl(currentRow.id);
    if (next) next.style.visibility = "hidden";
    renderPanelView();
    panelEl.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    if (!reduceMotion) {
      panelBody.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
        { duration: 260, easing: "ease-out" });
    }
  }

  /* ========= 補建語意索引 ========= */
  async function checkReindex() {
    let info;
    try { info = await api("/api/reindex"); } catch { return; }
    const bar = $("reindexBar");
    if (!info.configured || !info.remaining) { bar.hidden = true; return; }
    $("reindexText").textContent = `有 ${info.remaining} 則筆記還沒建立語意索引，建立後搜尋才能理解意思、找到相關筆記。`;
    bar.hidden = false;
  }

  $("reindexBtn").addEventListener("click", async () => {
    const btn = $("reindexBtn"), text = $("reindexText");
    btn.disabled = true;
    let doneTotal = 0;
    try {
      for (let guard = 0; guard < 200; guard++) {
        const r = await api("/api/reindex", { method: "POST" });
        doneTotal += r.done || 0;
        text.textContent = `建立中…已完成 ${doneTotal} 則，還剩 ${r.remaining} 則`;
        if (!r.remaining || (!r.done && r.failed)) break;
      }
      await checkReindex();
      if ($("reindexBar").hidden) toast("語意索引建立完成");
    } catch (e) {
      text.textContent = `建立時發生錯誤：${e.message}。可以稍後再按一次繼續。`;
    }
    btn.disabled = false;
  });

  /* ========= AI 整理 ========= */
  const AI_MAX = 10;
  const ai = { numbers: new Map(), ids: [], busy: false, reqId: 0 };

  function isFiltered() { return Boolean(state.q || state.tags.length); }

  function updateAiBar() {
    $("aiBar").hidden = !(isFiltered() && state.items.length > 0) || !$("aiCard").hidden;
  }

  function resetAi() {
    ai.reqId++;
    ai.numbers.clear(); ai.ids = []; ai.busy = false;
    cardsEl.querySelectorAll(".cite-badge").forEach(n => n.remove());
    $("aiCard").hidden = true; $("aiCard").innerHTML = "";
    $("aiBtn").disabled = false;
    updateAiBar();
  }

  function openById(id) {
    const row = state.items.find(r => String(r.id) === String(id));
    if (row) openPanel(row, findCardEl(id));
  }

  $("aiBtn").addEventListener("click", async () => {
    if (ai.busy) return;
    const rows = state.items.slice(0, AI_MAX);
    if (!rows.length) return;
    ai.busy = true;
    const my = ++ai.reqId;
    $("aiBar").hidden = true;
    const card = $("aiCard");
    card.hidden = false;
    card.innerHTML = "";
    card.append(
      el("span", { class: "ai-label", text: `AI 整理｜根據前 ${rows.length} 筆結果` }),
      el("div", { class: "ai-loading" }, [el("span", { class: "spinner" }), "正在讀你的筆記…"]),
    );
    try {
      const r = await api("/api/summarize", { method: "POST", body: JSON.stringify({ q: state.q, ids: rows.map(x => x.id) }) });
      if (my !== ai.reqId) return;
      ai.ids = r.ids.map(String);
      ai.numbers = new Map(ai.ids.map((id, i) => [id, i + 1]));
      renderAiCard(r);
      ai.ids.forEach((id, i) => {
        const c = findCardEl(id);
        if (c && !c.querySelector(".cite-badge")) c.append(el("span", { class: "cite-badge", text: i + 1 }));
      });
    } catch (e) {
      if (my !== ai.reqId || e.message === "unauthorized") return;
      card.innerHTML = "";
      card.append(
        el("span", { class: "ai-label", text: "AI 整理" }),
        el("p", { class: "ai-intro", text: e.message || "整理失敗，請稍後再試" }),
        el("div", { class: "ai-foot" }, [el("button", { class: "pill push", type: "button", text: "收起", onclick: resetAi })]),
      );
    } finally {
      if (my === ai.reqId) ai.busy = false;
    }
  });

  function citeButtons(refs) {
    return refs.map(n => {
      const id = ai.ids[n - 1];
      return el("button", { class: "cite", type: "button", text: n, "aria-label": `打開第 ${n} 則筆記`, onclick: () => openById(id) });
    });
  }

  function renderAiCard(r) {
    const card = $("aiCard");
    card.innerHTML = "";
    const parts = [el("span", { class: "ai-label", text: `AI 整理｜根據前 ${r.ids.length} 筆結果` })];
    if (r.intro) parts.push(el("p", { class: "ai-intro", text: r.intro }));
    if (r.points?.length) {
      parts.push(el("ul", { class: "ai-points" }, r.points.map(p => el("li", {}, [p.text, ...citeButtons(p.refs || [])]))));
    }
    if (r.excluded) parts.push(el("p", { class: "ai-excluded", text: r.excluded }));
    const plain = [r.intro, ...(r.points || []).map(p => `・${p.text}`), r.excluded].filter(Boolean).join("\n");
    const copyBtn = el("button", { class: "pill", type: "button", text: "複製" });
    copyBtn.addEventListener("click", () => navigator.clipboard.writeText(plain).then(() => toast("已複製")).catch(() => toast("複製失敗")));
    parts.push(el("div", { class: "ai-foot" }, [
      el("span", { text: "只根據這些筆記整理，筆記裡沒有的不會自己補。" }),
      el("span", { class: "push" }, [copyBtn]),
      el("button", { class: "pill", type: "button", text: "收起", onclick: resetAi }),
    ]));
    card.append(...parts);
  }

  /* ========= 重溫 ========= */
  const rs = { loaded: false, onThisDay: [], random: null };

  function updateResurface() {
    const sec = $("resurface");
    const home = !state.q && !state.tags.length && !state.type;
    sec.hidden = !home || (!rs.onThisDay.length && !rs.random);
    if (home && !rs.loaded) loadResurface();
  }

  async function loadResurface() {
    rs.loaded = true;
    try {
      const r = await api("/api/resurface");
      rs.onThisDay = r.onThisDay || [];
      rs.random = r.random || null;
    } catch { return; }
    renderResurface();
    updateResurface();
  }

  function rsCard({ row, label, meta, bg, rot, extra }) {
    const card = el("article", { class: "rs-card" });
    card.style.background = bg;
    const title = el("button", { class: "rs-title", type: "button", text: row.title || "無標題記錄" });
    title.addEventListener("click", () => openPanel(row, card));
    const tags = (Array.isArray(row.tags) ? row.tags : []).slice(0, 3);
    const lab = el("span", { class: "rs-label", text: label });
    lab.style.setProperty("--rot", rot);
    card.append(
      lab,
      el("span", { class: "rs-meta", text: meta }),
      title,
      row.summary ? el("p", { class: "rs-summary", text: row.summary }) : null,
      el("div", { class: "rs-foot" }, [
        el("div", { class: "rs-tags" }, tags.map((t, i) => { const s = el("span", { text: t }); s.style.setProperty("--rot", ROTS[i % ROTS.length]); return s; })),
        extra || null,
      ]),
    );
    return card;
  }

  function fmtDay(iso) {
    return iso ? new Date(iso).toLocaleDateString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit" }) : "";
  }

  function renderResurface() {
    const sec = $("resurface");
    sec.innerHTML = "";
    const day = rs.onThisDay[0];
    if (day) {
      const more = rs.onThisDay.length - 1;
      sec.append(rsCard({
        row: day, bg: "#BFE0FF", rot: "-3deg",
        label: `${day.years_ago || 1} 年前的今天`,
        meta: fmtDay(day.created_at) + (more > 0 ? ` · 那天還存了 ${more} 則` : ""),
      }));
    }
    if (rs.random) {
      const again = el("button", { class: "pill", type: "button", text: "換一則" });
      again.addEventListener("click", async () => {
        again.disabled = true;
        try {
          const r = await api(`/api/resurface?random=1&exclude=${encodeURIComponent(rs.random.id)}`);
          if (r.random) { rs.random = r.random; renderResurface(); }
        } catch (e) { toast(e.message, 2500); }
        again.disabled = false;
      });
      sec.append(rsCard({
        row: rs.random, bg: "#BDEBD3", rot: "2deg",
        label: "隨機一則", meta: `${fmtDay(rs.random.created_at)} 存的`, extra: again,
      }));
    }
  }

  /* ========= 從 Telegram 點進來：?note=123 ========= */
  async function openDeepLink(id) {
    if (!id) return;
    try {
      const { data } = await api(`/api/notes?id=${encodeURIComponent(id)}`);
      if (data) openPanel(data, null);
    } catch (e) { if (e.message !== "unauthorized") toast("找不到這則筆記", 2500); }
  }

  function start() {
    const deepNote = new URLSearchParams(location.search).get("note");
    readUrl();
    renderFilters();
    loadTags();
    search(false);
    checkReindex();
    if (deepNote) openDeepLink(deepNote);
  }

  (async () => {
    try {
      const s = await api("/api/session");
      if (!s.authed) { showLogin(); if (!s.configured) $("loginError").textContent = "伺服器尚未設定 APP_PASSWORD"; return; }
      start();
    } catch { showLogin(); }
  })();
</script>
</body>
</html>
